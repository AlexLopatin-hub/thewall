services:
  thewall-app:
    build: .
    container_name: "thewall-app"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - HTTP_ADDR=${HTTP_ADDR}
      - SHUTDOWN_TIMEOUT=${SHUTDOWN_TIMEOUT}

      - POSTGRES_HOST=thewall-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
    restart: always
    depends_on:
      - thewall-postgres

  thewall-postgres:
    image: postgres:18-trixie
    container_name: thewall-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: thewall-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:thewall-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
