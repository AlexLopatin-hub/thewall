services:
  thewall-app:
    build: .
    container_name: "thewall-app"
    ports:
      - "8080:8080"
    environment:
      - HTTP_ADDR=${HTTP_ADDR}
      - SHUTDOWN_TIMEOUT=${SHUTDOWN_TIMEOUT}

      - POSTGRES_HOST=thewall-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully

  thewall-postgres:
    image: postgres:18-trixie
    container_name: thewall-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d my_database"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: thewall-postgres-migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    command:
      -path /migrations
      -database postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@thewall-postgres:5432/${POSTGRES_DB}?sslmode=disable
      up
    depends_on:
      thewall-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: thewall-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:thewall-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  thewall-frontend:
    build: "./frontend"
    container_name: "thewall-frontend"
    restart: always
    ports:
      - "80:80"
    depends_on:
      - thewall-app
