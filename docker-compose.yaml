services:
  thewall:
    image: "thewall:latest"
    container_name: "thewall"
    ports:
      - "127.0.0.1:8080:8080"

  thewall-postgres:
    image: postgres:18-trixie
    container_name: thewall-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: thewall-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:thewall-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
